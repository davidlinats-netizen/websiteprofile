<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">AI news digest workflow built with n8n</title><desc id="desc">RSS news feeds pass into AI summarization, then branch to a Discord digest and an Obsidian archive. This is an explanatory illustration, not an n8n screenshot.</desc>
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#223047" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#77a9cf"/></marker></defs>
<rect width="1000" height="560" rx="20" fill="#0a1220"/><rect width="1000" height="560" rx="20" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="48" y="58" fill="#ff8d82" font-size="18" font-weight="700" letter-spacing="3">n8n / AI AUTOMATION</text><text x="48" y="104" fill="#f0f5ff" font-size="32" font-weight="700">From news feeds to a useful digest.</text>
<g fill="none" stroke="#77a9cf" stroke-width="3" marker-end="url(#arrow)"><path d="M270 286H356"/><path d="M600 286H642V214H700"/><path d="M600 286H642V390H700"/></g>
<rect x="48" y="218" width="222" height="136" rx="14" fill="#13253a" stroke="#65bce4"/><text x="72" y="252" fill="#65bce4" font-size="14" letter-spacing="2">01 / COLLECT</text><text x="72" y="290" fill="#f0f5ff" font-size="26" font-weight="700">RSS feeds</text><text x="72" y="321" fill="#bac9dc" font-size="17">AI + technology news</text>
<rect x="356" y="218" width="244" height="136" rx="14" fill="#142a29" stroke="#6ed6b2"/><text x="380" y="252" fill="#6ed6b2" font-size="14" letter-spacing="2">02 / SUMMARIZE</text><text x="380" y="290" fill="#f0f5ff" font-size="26" font-weight="700">AI summary</text><text x="380" y="321" fill="#bac9dc" font-size="17">Short, readable updates</text>
<rect x="700" y="150" width="252" height="128" rx="14" fill="#24213d" stroke="#aaa0ff"/><text x="724" y="183" fill="#aaa0ff" font-size="14" letter-spacing="2">03 / SHARE</text><text x="724" y="218" fill="#f0f5ff" font-size="26" font-weight="700">Discord</text><text x="724" y="249" fill="#bac9dc" font-size="17">Post the news digest</text>
<rect x="700" y="326" width="252" height="128" rx="14" fill="#24213d" stroke="#aaa0ff"/><text x="724" y="359" fill="#aaa0ff" font-size="14" letter-spacing="2">04 / SAVE</text><text x="724" y="394" fill="#f0f5ff" font-size="26" font-weight="700">Obsidian</text><text x="724" y="425" fill="#bac9dc" font-size="17">Keep a searchable archive</text>
<text x="48" y="505" fill="#bac9dc" font-size="17">Built with n8n · Connected to Discord and Obsidian</text><text x="48" y="535" fill="#8295af" font-size="14">Workflow illustration based on the project documentation. Not an n8n interface screenshot.</text></g></svg>